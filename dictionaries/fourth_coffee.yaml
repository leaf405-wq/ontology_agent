name: Fourth Coffee
description: Microsoft Fabric IQ Ontology Playground 风格的咖啡连锁本体（6 实体 / 7 关系）。
entities:
  - id: customer
    name: Customer
    icon: "👤"
    color: "#0078D4"
    description: 在门店购买咖啡产品的顾客
    properties:
      - { name: customerId, type: string, identifier: true, description: 顾客主键 }
      - { name: name, type: string, description: 姓名 }
      - { name: email, type: string, description: 邮箱 }
      - { name: loyaltyTier, type: enum, values: [Bronze, Silver, Gold, Platinum], description: 会员等级 }
      - { name: joinDate, type: date, description: 入会日期 }
      - { name: totalSpend, type: decimal, unit: USD, description: 累计消费, measure: true }
  - id: order
    name: Order
    icon: "🧾"
    color: "#107C10"
    description: 顾客在门店的一笔购买
    properties:
      - { name: orderId, type: string, identifier: true, description: 订单主键 }
      - { name: timestamp, type: datetime, description: 下单时间 }
      - { name: total, type: decimal, unit: USD, description: 订单金额, measure: true }
      - { name: status, type: enum, values: [Pending, Preparing, Ready, Completed, Cancelled], description: 状态 }
      - { name: paymentMethod, type: enum, values: [Card, Cash, Mobile, Gift Card], description: 支付方式 }
  - id: product
    name: Product
    icon: "☕"
    color: "#5C2D91"
    description: 可售卖的咖啡或周边
    properties:
      - { name: productId, type: string, identifier: true, description: 产品主键 }
      - { name: name, type: string, description: 产品名 }
      - { name: category, type: enum, values: [Espresso, Brewed, Cold Brew, Tea, Food, Merchandise], description: 品类 }
      - { name: price, type: decimal, unit: USD, description: 单价, measure: true }
      - { name: origin, type: string, description: 产地 }
      - { name: isOrganic, type: boolean, description: 是否有机 }
  - id: store
    name: Store
    icon: "🏪"
    color: "#FFB900"
    description: 实体门店
    properties:
      - { name: storeId, type: string, identifier: true, description: 门店主键 }
      - { name: name, type: string, description: 店名 }
      - { name: city, type: string, description: 城市 }
      - { name: state, type: string, description: 州/省 }
      - { name: openDate, type: date, description: 开业日期 }
      - { name: capacity, type: integer, description: 座位容量 }
  - id: supplier
    name: Supplier
    icon: "🚚"
    color: "#D83B01"
    description: 咖啡豆或货品供应商
    properties:
      - { name: supplierId, type: string, identifier: true, description: 供应商主键 }
      - { name: name, type: string, description: 公司名 }
      - { name: country, type: string, description: 国家 }
      - { name: certification, type: enum, values: [Fair Trade, Rainforest Alliance, Organic, Direct Trade, None], description: 认证 }
      - { name: rating, type: decimal, description: 质量评分 1-5, measure: true }
  - id: shipment
    name: Shipment
    icon: "📦"
    color: "#00A9E0"
    description: 供应商发往门店的货物
    properties:
      - { name: shipmentId, type: string, identifier: true, description: 发货主键 }
      - { name: dispatchDate, type: date, description: 发货日 }
      - { name: arrivalDate, type: date, description: 到达日 }
      - { name: status, type: enum, values: [In Transit, Delivered, Delayed], description: 状态 }
      - { name: weight, type: decimal, unit: kg, description: 重量, measure: true }

relationships:
  - { id: customer_places_order, name: places, from: customer, to: order, cardinality: one-to-many, description: 顾客下一笔或多笔订单 }
  - { id: order_contains_product, name: contains, from: order, to: product, cardinality: many-to-many, description: 订单包含产品, attributes: [{ name: quantity, type: integer }, { name: lineAmount, type: decimal }] }
  - { id: order_processed_at_store, name: processedAt, from: order, to: store, cardinality: many-to-one, description: 订单在某门店处理 }
  - { id: product_sourced_from_supplier, name: sourcedFrom, from: product, to: supplier, cardinality: many-to-one, description: 产品原料来自供应商 }
  - { id: shipment_from_supplier, name: sentBy, from: shipment, to: supplier, cardinality: many-to-one, description: 发货由供应商发出 }
  - { id: shipment_to_store, name: deliveredTo, from: shipment, to: store, cardinality: many-to-one, description: 发货送达门店 }
  - { id: shipment_contains_product, name: carries, from: shipment, to: product, cardinality: many-to-many, description: 发货承运产品, attributes: [{ name: quantity, type: integer }] }
